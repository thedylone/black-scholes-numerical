# The build, kit header/footer injection and deploy live in thedylone/style.
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  pages:
    uses: thedylone/style/.github/workflows/pages.yml@main
    with:
      site: web/dist
      build: npm ci && npm test && npm run build
      working-directory: web
